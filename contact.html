<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(0, 0, 33);
            color: white;
            font-family: monospace;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 80px;
            background-color: rgb(0, 0, 50);
        }

        .left {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav ul {
            display: flex;
        }

        nav ul li {
            list-style: none;
            margin: 0 23px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: rgb(131, 131, 199);
        }


        /* Contact Section */

        .contact-section {
            min-height: calc(100vh - 80px);
            background-color: rgb(0, 0, 70);
            padding: 60px 10%;
        }

        .contact-section h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 15px;
            color: white;
        }

        .subtitle {
            text-align: center;
            color: rgb(200, 200, 255);
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        .contact-container {
            display: flex;
            justify-content: space-between;
            gap: 60px;
        }

        .contact-info,
        .contact-form {
            flex: 1;
        }

        .contact-info h2 {
            color: rgb(170, 107, 228);
            font-size: 2rem;
            margin-bottom: 25px;
        }

        .contact-info p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: white;
        }

        .social-links {
            margin-top: 25px;
        }

        .social-links a {
            text-decoration: none;
            color: white;
            border: 2px solid rgb(170, 107, 228);
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .social-links a:hover {
            background-color: rgb(170, 107, 228);
        }

        .contact-form form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .contact-form input,
        .contact-form textarea {
            background-color: rgb(0, 0, 50);
            border: 2px solid rgb(170, 107, 228);
            color: white;
            padding: 15px;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            font-family: monospace;
        }

        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: rgb(180, 180, 180);
        }

        .contact-form button {
            background-color: rgb(170, 107, 228);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .contact-form button:hover {
            background-color: rgb(145, 85, 200);
            transform: translateY(-2px);
        }

        /* Mobile Responsive */

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                height: auto;
                padding: 15px 0;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                margin-top: 10px;
            }

            .contact-container {
                flex-direction: column;
                gap: 40px;
            }

            .contact-section {
                padding: 40px 20px;
            }

            .contact-section h1 {
                font-size: 2.2rem;
            }

            .contact-info h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="left">Divyansh's Portfolio</div>

            <div class="right">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="contact-section">

            <h1>Contact Me</h1>
            <p class="subtitle">
                Have a project in mind or want to work together? Feel free to reach out.
            </p>

            <div class="contact-container">

                <div class="contact-info">
                    <h2>Get In Touch</h2>

                    <p>📧 Email: divyansh.tyagi8059@gmail.com</p>
                    <p>📱 Phone: +91 8059232523</p>
                    <p>📍 Location: Karnal, India</p>

                    <div class="social-links">
                        <a href="https://www.youtube.com/@Edit_Verse-9999" target="_blank">YouTube</a>
                    </div>
                </div>

                <div class="contact-form">
                    <form action="https://api.web3forms.com/submit" method="POST">
                        <input type="hidden" name="access_key" value="31cf5673-6df4-4002-a579-bd41a76e61e4">

                        <input type="email" placeholder="Your Email" required>

                        <input type="text" placeholder="Subject">

                        <textarea name="message" required></textarea>

                        <button type="submit">Send Message</button>
                    </form>
                </div>

            </div>

        </section>
    </main>
</body>

</html>
